<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小説個人サイト</title>
  <style>
    body { font-family: "Helvetica Neue", Arial, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; background: #fdfdfd; color: #333; line-height: 1.8; }
    header { border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.5rem; margin: 0; }
    
    /* ナビゲーションボタン */
    .nav-btn { display: inline-block; background: #f0f0f0; color: #333; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 0.9rem; font-weight: bold; }
    .nav-btn:hover { background: #e0e0e0; }

    h2 { font-size: 1.2rem; border-bottom: 2px solid #0066cc; padding-bottom: 5px; margin-top: 30px; }
    
   
    .novel-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 15px; margin-bottom: 15px; display: block; text-decoration: none; color: inherit; transition: border-color 0.2s; }
    .novel-card:hover { border-color: #0066cc; }
    .novel-title { font-weight: bold; font-size: 1.1rem; color: #0066cc; margin-bottom: 5px; }
    .novel-desc { font-size: 0.85rem; color: #666; margin: 0; }
  </style>
</head>
<body>

 <header>
    <h1>自作小説集</h1>
    <!-- 近況・雑記ページ（diary.html）へのリンクボタン -->
    <a href="diary.html" class="nav-btn">📝 近況・雑記</a>
  </header>

  <main>
    <!-- 作品1へのリンク -->
    <a href="novel1.html" class="novel-card">
      <div class="novel-title">第一話：はじまりの街</div>
      <p class="novel-desc">主人公が旅立つ前の静かな朝の物語。</p>
    </a>

    <!-- 作品2へのリンク -->
    <a href="novel2.html" class="novel-card">
      <div class="novel-title">第二話：森の出会い</div>
      <p class="novel-desc">不思議な少女と出会うエピソード。</p>
    </a>
  </main>

</body>
</html>
