<!DOCTYPE html>
<html lang="ja">
<head>

    header { border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 25px; }

    .back-btn { display: inline-block; margin-bottom: 15px; color: #0066cc; text-decoration: none; font-size: 0.9rem; }

    .diary-entry { background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 20px; margin-bottom: 20px; }
    .diary-date { font-size: 0.85rem; color: #888; font-family: monospace; }
    .diary-title { font-weight: bold; font-size: 1.1rem; margin: 5px 0 10px 0; color: #333; }
    .diary-content { white-space: pre-wrap; line-height: 1.8; }

</head>
<body>

  <header>

現在、第三話の執筆を進めています。
